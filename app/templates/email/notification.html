<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7f0;max-width:480px;width:100%;">
        <tr><td style="background:#4f46e5;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:700;">CypherCrew</td></tr>
        <tr><td style="padding:28px;color:#1f2937;font-size:15px;line-height:1.6;">
          <p style="margin:0 0 6px;font-size:16px;font-weight:700;">{{ subject }}</p>
          <p style="margin:0 0 20px;">{{ body }}</p>
          {% if link %}
          <p style="margin:0 0 8px;text-align:center;">
            <a href="{{ link }}" style="background:#4f46e5;color:#ffffff;text-decoration:none;padding:11px 24px;border-radius:8px;font-weight:600;display:inline-block;">Open in CypherCrew</a>
          </p>
          {% endif %}
        </td></tr>
        <tr><td style="padding:16px 28px;color:#9ca3af;font-size:12px;border-top:1px solid #eef0f5;">
          You're receiving this because you have a CypherCrew account.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
