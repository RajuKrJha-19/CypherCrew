{#
    Light/dark toggle. A quiet ghost icon in the top bar - the standard,
    discoverable home for it. The actual theme is resolved before paint
    by the inline script in base.html; this just flips and persists it.
#}
<button type="button"
        class="theme-switch"
        id="themeToggle"
        role="switch"
        aria-label="Toggle dark mode"
        title="Toggle light / dark">
    <span class="theme-switch-thumb"></span>
    <span class="theme-switch-icon theme-switch-sun">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <line x1="12" y1="2" x2="12" y2="4"/>
            <line x1="12" y1="20" x2="12" y2="22"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="2" y1="12" x2="4" y2="12"/>
            <line x1="20" y1="12" x2="22" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
    </span>
    <span class="theme-switch-icon theme-switch-moon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </span>
</button>

<script>
    (function () {
        const btn = document.getElementById("themeToggle");
        if (!btn) return;

        const root = document.documentElement;

        function apply(theme, animate) {
            if (animate) {
                root.classList.add("theme-switching");
                window.setTimeout(function () {
                    root.classList.remove("theme-switching");
                }, 300);
            }
            root.setAttribute("data-theme", theme);
            // role="switch" expects aria-checked (not aria-pressed); apply()
            // runs at init below so the state is set from first paint.
            btn.setAttribute("aria-checked", theme === "dark" ? "true" : "false");
        }

        btn.addEventListener("click", function () {
            const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            try { localStorage.setItem("theme", next); } catch (e) {}
            apply(next, true);
        });

        // Until the user picks a side, keep following the OS setting live.
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        media.addEventListener("change", function (event) {
            let saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) {}
            if (!saved) apply(event.matches ? "dark" : "light", true);
        });

        apply(root.getAttribute("data-theme") || "light", false);
    })();
</script>
