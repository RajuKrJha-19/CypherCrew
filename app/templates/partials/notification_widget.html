<div class="notification-widget">

    <button
        id="mentionsBtn"
        class="notification-btn top-notification-btn"
        type="button"
        aria-label="Mentions"
        aria-haspopup="true"
        aria-expanded="false"
    >
        <i class="fa-solid fa-at"></i>
        <span id="mentionsBadge" class="notification-dot" hidden></span>
    </button>

    <button
        id="notificationBtn"
        class="notification-btn top-notification-btn"
        type="button"
        aria-label="Notifications"
        aria-haspopup="true"
        aria-expanded="false"
    >
        <i class="fa-solid fa-bell"></i>
        <span id="notificationBadge" class="notification-dot" hidden></span>
    </button>

</div>

<div id="mentionsPanel" class="notification-panel">

    <div class="notification-panel-head notification-header">
        <strong>Mentions</strong>
    </div>

    <div id="mentionsList" class="notification-list">
        <p class="notification-empty">
            No mentions yet
        </p>
    </div>

</div>

<div id="notificationPanel" class="notification-panel">

    <div class="notification-panel-head notification-header">
        <strong>Notifications</strong>
    </div>

    <div id="notificationList" class="notification-list">
        <p class="notification-empty">
            No notifications
        </p>
    </div>

</div>

<audio id="notificationSound" preload="auto">
    <source
        src="{{ url_for('static', filename='audio/notification.mp3') }}"
        type="audio/mpeg"
    >
</audio>

<script>
    window.CYPHER_NOTIFICATION_API =
        "{{ url_for('notifications.api_notifications') }}";

    window.CYPHER_NOTIFICATION_MARK_READ =
        "{{ url_for('notifications.mark_read') }}";
</script>

<script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
