{% extends "base.html" %}

{% block title %}Page not found | CypherCrew{% endblock %}

{% block body %}
<div class="error-page">
    <div class="error-card">
        <div class="error-code">404</div>
        <i class="fa-solid fa-compass error-icon"></i>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist, or it may have moved.</p>
        <div class="error-actions">
            <a href="{{ url_for('dashboard.index') }}" class="btn">Go to dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
